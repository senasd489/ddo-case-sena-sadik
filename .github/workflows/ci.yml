name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Açık "shell: bash" → bash -eo pipefail: "komut | tee" hatayı yutmasın.
defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (build · lint · test · coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enerjihat
          POSTGRES_PASSWORD: enerjihat
          POSTGRES_DB: enerjihat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enerjihat" --health-interval 3s --health-timeout 3s --health-retries 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      GOFLAGS: -mod=vendor
      TEST_DATABASE_URL: postgres://enerjihat:enerjihat@localhost:5432/enerjihat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build
        run: go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: backend
          args: --timeout=5m
      - name: Test (race + coverage)
        run: |
          go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./... 2>&1 | tee test.log
          echo "Geçen test sayısı: $(go test -count=1 -v ./... 2>/dev/null | grep -c -- '--- PASS')"
      - name: Coverage report (domain ≥ 70%)
        run: |
          python3 ../scripts/domain-coverage.py coverage.out 70 | tee coverage.md
          { echo "## Test kapsamı"; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  frontend:
    name: Frontend (type-check · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Docker images · compose · make verify · k6
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images & start stack (cold)
        run: |
          cp .env.example .env
          start=$(date +%s)
          docker compose up --build -d
          ./scripts/wait-healthy.sh 300
          echo "### Soğuk başlangıç: $(( $(date +%s) - start )) sn (derleme dahil)" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps -a
      - name: Non-root & image sizes
        run: |
          for s in api simulator frontend; do
            u=$(docker inspect --format '{{.Config.User}}' $(docker compose ps -q $s))
            echo "$s user=$u"; test -n "$u" && test "$u" != "0" && test "$u" != "root"
          done
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i enerjihat | tee -a "$GITHUB_STEP_SUMMARY"
      - name: make verify
        run: |
          docker compose --profile verify run --rm --build verify | tee verify.txt
          { echo "## make verify"; grep -E '^\|' verify.txt; tail -1 verify.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: k6 (kısa yük testi)
        run: |
          docker run --rm -i --network enerjihat_default -e API_URL=http://api:8080 -e INGEST_TOKEN=$(grep ^INGEST_TOKEN .env | cut -d= -f2) \
            -e DURATION=30s grafana/k6:0.54.0 run --summary-trend-stats "avg,med,p(95),p(99),max" - < scripts/load/k6.js | tee k6.txt
          { echo "## k6 (30 sn)"; echo '```'; grep -E 'http_req_duration|scenario|http_req_failed|http_reqs|ingest_batch' k6.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Chaos (DB down → 503 → up → 200)
        run: |
          docker compose stop db
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/health)" = "503"
          docker compose start db
          ./scripts/wait-healthy.sh 120
          echo "Kaos: DB durdu → /health 503, döndü → 200" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
