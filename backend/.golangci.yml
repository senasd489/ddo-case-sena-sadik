version: "2"
run:
  modules-download-mode: vendor
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - noctx
    - sqlclosecheck
    - rowserrcheck
  settings:
    errcheck:
      # Kapatma hataları ve metrik yazımı bilinçli olarak yok sayılıyor.
      exclude-functions:
        - (io.Closer).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - fmt.Fprintf
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go
        linters: [noctx, bodyclose]
