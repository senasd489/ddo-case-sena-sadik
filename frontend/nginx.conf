server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # API ve sağlık uçlarını compose ağındaki Go backend'e aktar
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE (canlı akış) için
        proxy_read_timeout 1h;
    }
    location = /health { proxy_pass http://api:8080/health; }

    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
